name: Build iOS Tweak
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "26.2"
      
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      
      - name: Install ldid
        run: brew install ldid
      
      - name: Setup ldid PATH
        run: |
          LDD=$(which ldid)
          echo "ldid at: $LDD"
          sudo ln -sf "$LDD" /usr/local/bin/ldid
      
      - name: Download patched SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/sdks"
          curl -fsSL "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" | tar -xJ -C "$THEOS/sdks"
          ls "$THEOS/sdks"
      
      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          make
      
      - name: Re-sign dylib (final bytes)
        run: |
          DYLIB=".theos/obj/debug/iGameGodBypass.dylib"
          codesign --force --sign - "$DYLIB"
          echo "Signed. Verifying:"
          codesign -dv "$DYLIB" 2>&1 | head -5
      
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iGameGodBypass-dylib
          path: .theos/obj/debug/iGameGodBypass.dylib
