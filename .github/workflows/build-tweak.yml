name: Build iOS Tweak
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
      
      - name: Download patched SDK (bypass api.github.com rate limit)
        run: |
          export THEOS=$HOME/theos
          mkdir -p "$THEOS/sdks"
          curl -fsSL "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz" | tar -xJ -C "$THEOS/sdks"
          ls "$THEOS/sdks"
      
      - name: Build tweak
        run: |
          export THEOS=$HOME/theos
          export PATH="/opt/homebrew/bin:$PATH"
          make package FINALPACKAGE=1 TARGET="iphone:clang:16.5:15.0"
      
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: iGameGodBypass-dylib
          path: .theos/obj/iphone/arm64/iGameGodBypass.dylib
